body: Merge server and client builder-code s arrays during extension re-merge instead of dropping the client's, treat echoed extension-info arrays as additive (client-first, deduped, with scalar/array coercion) via a JSON round-trip that also handles non-[]interface{} slice types, and let DeclareBuilderCodeExtension optionally declare service codes for the application itself
